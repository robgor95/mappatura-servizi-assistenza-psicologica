name: Verify production SEO 7.7.4
on:
  push:
    branches: [verify-production-seo-v7-7-4]
    paths: ['.github/workflows/verify-production-seo-v7-7-4.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public production remains non-indexable
        run: |
          set -euo pipefail
          BASE="https://mappatura-servizi-assistenza-psicologica.pages.dev"
          for i in $(seq 1 12); do
            if curl -fsS "$BASE/version.json?qa=seo774prod" | grep -q '"web_version": "7.7.4"'; then break; fi
            sleep 5
          done
          VERSION="$(curl -fsS "$BASE/version.json?qa=seo774prod")"
          echo "$VERSION" | grep -q '"indexing_enabled": false'
          echo "$VERSION" | grep -q '"sitemap_ready": true'
          HEADERS="$(curl -fsSI "$BASE/?qa=seo774prod" | tr -d '\r')"
          echo "$HEADERS" | grep -i 'x-robots-tag:.*noindex'
          BODY="$(curl -fsS "$BASE/?qa=seo774prod")"
          echo "$BODY" | grep -q 'content="noindex,nofollow,noarchive,nosnippet,noimageindex"'
          echo "$BODY" | grep -q 'rel="canonical" href="https://mappatura-servizi-assistenza-psicologica.pages.dev/"'
          echo "$BODY" | grep -q 'property="og:title"'
          echo "$BODY" | grep -q 'id="seo-website-jsonld"'
          ROBOTS="$(curl -fsS "$BASE/robots.txt?qa=seo774prod")"
          echo "$ROBOTS" | grep -q 'Allow: /'
          if echo "$ROBOTS" | grep -q 'Disallow: /'; then exit 1; fi
          if echo "$ROBOTS" | grep -q '^Sitemap:'; then exit 1; fi
          SITEMAP="$(curl -fsS "$BASE/sitemap.xml?qa=seo774prod")"
          echo "$SITEMAP" | grep -q '/servizi.html'
          if echo "$SITEMAP" | grep -q '/archivio.html'; then exit 1; fi
          curl -fsSI "$BASE/downloads/guide/Guida_03_privato.pdf?qa=seo774prod" | tr -d '\r' | grep -i 'x-robots-tag:.*noindex'
          curl -fsSI "$BASE/archivio.html?qa=seo774prod" | tr -d '\r' | grep -i 'x-robots-tag:.*noindex'
          echo "Production SEO 7.7.4 verified: ready, indexing disabled."
