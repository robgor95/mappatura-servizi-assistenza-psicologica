name: V7.9.4 release verification
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-v7-9-4.yml
      - .github/workflows/verify-v7-9-3.yml
      - servizi.html
      - archivio.html
      - mappa.html
      - strutture-approfondite.html
      - documenti.html
      - version.json
      - assets/audit-data-v7-9-4.js
      - assets/servizi-v7-9-4.js
      - assets/map-data-v7-9-4.js
      - assets/directory-v7-9-4.js
      - data/audit_operativo_v7_9_4.json
      - data/presidi_geo_v7_9_4.json
      - downloads/*V7_9_4*
      - tools/*v7-9-4*
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v7-9-4.yml
      - servizi.html
      - archivio.html
      - mappa.html
      - strutture-approfondite.html
      - documenti.html
      - version.json
      - assets/audit-data-v7-9-4.js
      - assets/servizi-v7-9-4.js
      - assets/map-data-v7-9-4.js
      - assets/directory-v7-9-4.js
      - data/audit_operativo_v7_9_4.json
      - data/presidi_geo_v7_9_4.json
      - downloads/*V7_9_4*
      - tools/*v7-9-4*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v794-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release, data and historical preservation
        run: |
          set -euo pipefail
          mkdir -p /tmp/v794-verification
          node tools/export-current-v7-9-4.cjs /tmp/current-v794.json
          node tools/test-v7-9-4.cjs | tee /tmp/v794-verification/data-tests.json
          node --check assets/audit-data-v7-9-4.js
          node --check assets/servizi-v7-9-4.js
          node --check assets/map-data-v7-9-4.js
          node --check assets/directory-v7-9-4.js
          node --check tools/test-ui-v7-9-4.mjs
          python -m py_compile tools/verify-production-v7-9-4.py
          python - <<'PY'
          import json,pathlib,subprocess
          v=json.loads(pathlib.Path('version.json').read_text())
          assert v['web_version']=='7.9.4'
          assert v['indexing_enabled'] is False
          assert v['counts_current']['search']==443
          assert v['counts_current']['moduli']==128
          assert v['counts_current']['structure_directory']==184
          assert v['map']['localized']==315 and v['map']['unlocated']==128
          assert v['map']['entrances_verified']==0
          base='2ad2126b5c972ce49956607e368fc45b3fc4f7e6'
          allowed={'README.md','CHANGELOG.md','version.json','servizi.html','archivio.html','mappa.html','strutture-approfondite.html','documenti.html','.github/workflows/verify-v7-9-3.yml'}
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          bad=[]
          for p in changed:
              existed=subprocess.run(['git','cat-file','-e',base+':'+p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if existed and p not in allowed: bad.append(p)
          assert not bad,bad
          PY
          npm install --prefix /tmp/v794-node playwright @axe-core/playwright
          ln -s /tmp/v794-node/node_modules node_modules
          /tmp/v794-node/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify pull-request runtime locally
        if: github.event_name == 'pull_request'
        run: |
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/v794-verification/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          QA_OUT=/tmp/v794-verification node tools/test-ui-v7-9-4.mjs
      - name: Verify exact Cloudflare production bytes and noindex
        if: github.event_name != 'pull_request'
        env:
          QA_OUT: /tmp/v794-verification
        run: python tools/verify-production-v7-9-4.py
      - name: Recheck browser behavior on actual production
        if: github.event_name != 'pull_request'
        env:
          QA_BASE: https://mappatura-servizi-assistenza-psicologica.pages.dev
          QA_OUT: /tmp/v794-verification
        run: node tools/test-ui-v7-9-4.mjs
      - name: Record exact tested tree
        if: always()
        run: |
          git rev-parse HEAD > /tmp/v794-verification/commit.txt
          git diff --name-status 2ad2126b5c972ce49956607e368fc45b3fc4f7e6 HEAD > /tmp/v794-verification/changed-files.txt
          git archive --format=zip HEAD -o /tmp/v794-verification/repository.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-9-4-${{ github.event_name }}-verification
          path: /tmp/v794-verification/
          retention-days: 30
          if-no-files-found: error
