name: V7.11.1 read-only research workspace
on:
  push:
    branches: [v7-11-1-geography-review]
    paths: [.github/workflows/research-v7-11-1.yml, tools/research-v7-11-1.py]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Research dependencies
        run: python -m pip install requests beautifulsoup4 osmium shapely
      - name: Acquire primary pages and one ODbL extract (no automatic publication)
        run: python tools/research-v7-11-1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7111-research-evidence
          path: /tmp/v7111-research/
          retention-days: 7
