name: V7.12 historical UX verification (manual)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: V7.12 commit or ref to verify locally
        required: true
        default: d57a6df5a3683a6ca4a77dc6ed47b51c15a29fcb
permissions:
  contents: read
jobs:
  verify_historical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Dependencies
        run: |
          pip install beautifulsoup4
          npm install --prefix /tmp/ux-v712-node playwright @axe-core/playwright
          ln -s /tmp/ux-v712-node/node_modules node_modules
          /tmp/ux-v712-node/node_modules/.bin/playwright install --with-deps chromium
      - name: Historical data, integrity and browser checks
        run: |
          set -euo pipefail
          mkdir -p /tmp/ux-v712-verification
          node tools/test-data-v7-12.cjs | tee /tmp/ux-v712-verification/data.json
          QA_OUT=/tmp/ux-v712-verification python tools/verify-ux-v7-12.py
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/ux-v712-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8123/ >/dev/null && break || sleep 1; done
          QA_OUT=/tmp/ux-v712-verification/browser node tools/test-ui-final-v7-12.mjs
      - name: Tested historical commit
        if: always()
        run: |
          mkdir -p /tmp/ux-v712-verification
          git rev-parse HEAD > /tmp/ux-v712-verification/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-v712-historical-${{ github.run_id }}
          path: /tmp/ux-v712-verification
          retention-days: 30
