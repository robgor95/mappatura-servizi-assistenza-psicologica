name: Multisite 7.7.5 verification
on:
  push:
    branches: [multisede-v7-7-5]
    paths:
      - 'data/multisede_v7_7_5.json'
      - 'assets/servizi-v7-5-1.js'
      - 'assets/directory-v7-5.js'
      - 'servizi.html'
      - 'archivio.html'
      - 'strutture-approfondite.html'
      - '.github/workflows/multisede-v7-7-5.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and data integrity
        run: |
          node --check assets/servizi-v7-5-1.js
          node --check assets/directory-v7-5.js
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const base=JSON.parse(fs.readFileSync('data/portal_data_v7_3.json','utf8'));
          const priv=JSON.parse(fs.readFileSync('data/privati_v7_5.json','utf8'));
          const add=JSON.parse(fs.readFileSync('data/multisede_v7_7_5.json','utf8'));
          assert.equal(add.records.length,4);
          const baseIds=new Set(base.moduli.map(r=>String(r.id_modulo||r.id||'')));
          const ids=add.records.map(r=>String(r.id_modulo||r.id||''));
          assert.equal(new Set(ids).size,ids.length);
          for(const id of ids) assert(!baseIds.has(id),'overlay id collides: '+id);
          const all=[...base.moduli,...add.records];
          const text=r=>JSON.stringify(r).toLowerCase();
          assert.equal(all.filter(r=>text(r).includes('reverie')).length,4,'Reverie must expose four units');
          assert.equal(all.filter(r=>text(r).includes('nuovi orizzonti')).length,2,'Nuovi Orizzonti must expose two Lazio units');
          const morlupo=add.records.filter(r=>String(r.indirizzo).toLowerCase().includes('morlupo'));
          assert.equal(morlupo.length,2,'same-address CTC2 and Centro Diurno must both remain');
          assert.notEqual(morlupo[0].servizio_id,morlupo[1].servizio_id);
          assert.equal(base.rete_asl.length+all.length+(priv.records||[]).length,432);
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          assert.equal(v.web_version,'7.7.5');
          assert.equal(v.counts_current.search,432);
          assert.equal(v.counts_current.multisite_overlay,4);
          console.log({rete:base.rete_asl.length,moduli:all.length,privati:(priv.records||[]).length,total:432});
          NODE
          git fetch origin main --quiet
          git diff --exit-code origin/main -- data/portal_data_v7_3.json data/strutture_approfondite_v7_5.json data/revisioni_v7_6.json data/privati_v7_5.json
      - name: Browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            async function serviceSearch(q,expected,names){
              await p.goto('http://127.0.0.1:8765/servizi.html?q='+encodeURIComponent(q),{waitUntil:'networkidle'});
              await p.locator('#svc-controls:not([disabled])').waitFor();
              await p.waitForFunction(()=>document.querySelectorAll('#svc-list .svc-card').length>0);
              const cards=await p.locator('#svc-list .svc-card h3').allTextContents();
              assert.equal(cards.length,expected,q+' count '+JSON.stringify(cards));
              for(const name of names)assert(cards.some(x=>x.includes(name)),q+' missing '+name);
              return cards;
            }
            await serviceSearch('Reverie',4,['Comunità terapeutica romana','Capena CTC 1','Capena CTC 2','Centro Diurno']);
            await serviceSearch('Nuovi Orizzonti',2,['Comunità di Piglio','Casa Gioia']);
            const morlupo=await serviceSearch('Via Morlupo 94',2,['Capena CTC 2','Centro Diurno']);
            await p.goto('http://127.0.0.1:8765/strutture-approfondite.html',{waitUntil:'networkidle'});
            await p.locator('#directory-search').fill('Reverie');
            await p.waitForFunction(()=>document.querySelector('#result-count')?.textContent.startsWith('4 di '));
            const structNames=await p.locator('#directory-grid .directory-card h2').allTextContents();
            assert.equal(structNames.length,4);
            await p.locator('#directory-search').fill('Nuovi Orizzonti');
            await p.waitForFunction(()=>document.querySelector('#result-count')?.textContent.startsWith('2 di '));
            const total=(await p.locator('#result-count').innerText()).match(/di\s+(\d+)/);
            assert(total);
            // Reset to verify total directory size after V7.6 + multisite overlay.
            await p.locator('[data-reset]').click();
            await p.waitForFunction(()=>document.querySelector('#result-count')?.textContent.startsWith('173 di 173'));
            await b.close();
            console.log('browser multisite checks: ok');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
