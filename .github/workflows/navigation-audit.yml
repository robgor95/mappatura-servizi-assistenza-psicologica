name: Navigation baseline audit
on:
  push:
    branches: [navigation-v7-7-3]
    paths: ['.github/workflows/navigation-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1979f0d51ed6d2203be6c02605bee313ac5cd91e
          persist-credentials: false
      - name: Snapshot audited production
        run: |
          git archive --format=zip HEAD -o /tmp/navigation-baseline.zip
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          pages=[*Path('.').glob('*.html'),*Path('guide').glob('*.html')]
          audit=[]
          for p in pages:
              text=p.read_text()
              audit.append({'file':str(p),'bytes':p.stat().st_size,'header':bool(re.search(r'<header',text)),'screenshot_phrase':bool(re.search(r'cognitivo.interpersonale|Non attribuiamo a etichette',text,re.I)),'download_links':len(re.findall(r'href="/downloads/',text))})
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          print(Path('version.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-baseline
          path: /tmp/navigation-baseline.zip
          retention-days: 3
