name: Tor Vergata - verifica collegamenti counselling e servizi ufficiali
on:
  push:
    branches: [pilot/tor-vergata-wordpress]
    paths:
      - 'tools/tor-vergata-link-audit.py'
      - '.github/workflows/verify-tor-vergata-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verifica raggiungibilità URL pubblici (solo lettura)
        run: python3 tools/tor-vergata-link-audit.py
