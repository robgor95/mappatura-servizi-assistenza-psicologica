name: Map baseline audit
on:
  push:
    branches: [ux-map-v7-8]
    paths: ['.github/workflows/map-baseline.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcda3c90cc241a848f67cb825bc8a10a742d6a65
          persist-credentials: false
      - name: Archive original repository and local Leaflet distribution
        run: |
          mkdir -p /tmp/map-audit/vendor
          git archive HEAD --format=zip -o /tmp/map-audit/baseline.zip
          curl --fail --location https://registry.npmjs.org/leaflet/-/leaflet-1.9.4.tgz -o /tmp/map-audit/vendor/leaflet.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: map-baseline
          path: /tmp/map-audit
          retention-days: 7
