name: V7.9.4 temporary builder
on:
  push:
    branches: [audit-v7-9-4]
    paths:
      - tools/build-v7-9-4.py
      - .github/workflows/build-v7-9-4.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-v7-9-4
          fetch-depth: 0
      - name: Guard main baseline
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = 2ad2126b5c972ce49956607e368fc45b3fc4f7e6
      - name: Build additive V7.9.4 candidate
        run: python tools/build-v7-9-4.py
      - name: Commit generated candidate
        run: |
          set -euo pipefail
          git config user.name robgor95
          git config user.email 73424454+robgor95@users.noreply.github.com
          git add README.md CHANGELOG.md version.json servizi.html archivio.html mappa.html strutture-approfondite.html assets data downloads tools/export-current-v7-9-4.cjs
          git commit -m "feat(v7.9.4): build geography, multisite and Colle Cesarano candidate"
          git push origin HEAD:audit-v7-9-4
