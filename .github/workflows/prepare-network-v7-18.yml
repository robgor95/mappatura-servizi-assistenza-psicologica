name: V7.18 preparation checkpoint (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5aa17a38df83d2000f93615bd116b26b7915bc40
          persist-credentials: false
      - name: Check the generated checkpoint, not production
        run: |
          node -e "const v=require('./version.json'); if(v.web_version!=='7.18')process.exit(1)"
          node -e "const r=require('./downloads/Verifiche_Network_V7_18.json'); if(r.passed!==r.total)process.exit(1); console.log(r.passed+' candidate checks passed')"
          echo 'The one-time generation is complete. Use verify-network-v7-18.yml for full candidate and production verification.'
