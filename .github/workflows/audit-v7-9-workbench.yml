name: V7.9 audit workbench
on:
  push:
    branches: [audit-geografia-v7-9]
    paths: [.github/workflows/audit-v7-9-workbench.yml]
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect cached preparation candidates
        run: |
          mkdir -p /tmp/audit-candidates
          node tools/export-map-rows.cjs /tmp/audit-candidates/map-rows.json
          python tools/research-geography-v7-9.py /tmp/audit-candidates
      - name: Archive exact working revision
        if: always()
        run: |
          git archive --format=zip HEAD -o /tmp/audit-candidates/worktree.zip
          git rev-parse HEAD > /tmp/audit-candidates/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-9-research-candidates
          path: /tmp/audit-candidates/
          retention-days: 7
          if-no-files-found: error
