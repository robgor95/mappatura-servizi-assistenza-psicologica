name: V7.9 audit workbench
on:
  push:
    branches: [audit-geografia-v7-9]
    paths: [.github/workflows/audit-v7-9-workbench.yml]
permissions:
  contents: read
jobs:
  official-civics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download public official regional address extract once
        run: |
          mkdir -p /tmp/anncsu
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          import json,hashlib,zipfile,datetime,io,csv
          O=Path('/tmp/anncsu');report=[]
          urls=[('indirizzario-lazio.zip','https://anncsu.open.agenziaentrate.gov.it/age-inspire/opendata/anncsu/getds.php?INDIR_LAZI='),('metadata.json','https://anncsu.gov.it/.allegati/metadata_indirizzario.json')]
          for name,u in urls:
           try:
            with urlopen(Request(u,headers={'User-Agent':'LazioServiceAudit/7.9 (offline civic verification; https://github.com/robgor95/mappatura-servizi-assistenza-psicologica)'}),timeout=120) as r:body=r.read(180000000);ct=r.headers.get('Content-Type','');final=r.url
            (O/name).write_bytes(body);entry={'url':u,'final_url':final,'file':name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'content_type':ct}
            if name.endswith('.zip'):
             with zipfile.ZipFile(io.BytesIO(body)) as z:
              entry['members']=z.namelist()
              for n in z.namelist():
               if n.lower().endswith('.csv'):
                with z.open(n) as f:entry['sample']=f.read(8000).decode('utf-8',errors='replace')
            report.append(entry)
           except Exception as e:report.append({'url':u,'error':str(e)})
          (O/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-9-official-civics
          path: /tmp/anncsu/
          retention-days: 7
          if-no-files-found: error
