name: V7.9 audit workbench
on:
  push:
    branches: [audit-geografia-v7-9]
    paths: [.github/workflows/audit-v7-9-workbench.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: v79-audit-workbench
  cancel-in-progress: false
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard main and reuse exact audited source and geocoding snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = 498195783ca07dff14dd4f3640e7e2fae3598e06
          mkdir -p /tmp/v79-research /tmp/v79-tests
          gh api repos/${{ github.repository }}/actions/artifacts/10669536677/zip > /tmp/v79-research.zip
          unzip -qo /tmp/v79-research.zip -d /tmp/v79-research
          gh api repos/${{ github.repository }}/actions/artifacts/10670595485/zip > /tmp/previous-candidate.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,io
          with zipfile.ZipFile('/tmp/previous-candidate.zip') as outer:
           with zipfile.ZipFile(io.BytesIO(outer.read('repository.zip'))) as inner:
            for p in ['tools/build-frontend-v7-9.py','tools/prepare-audit-v7-9.py','tools/prepare-release-v7-9.py']:
             Path(p).write_bytes(inner.read(p))
          p=Path('tools/prepare-release-v7-9.py');s=p.read_text().replace("/servizi.html?q=Le+Ali+del+Ponte'","/servizi.html?q=Le+Ali+del+Ponte&comune=Civitavecchia'");p.write_text(s)
          # The current directory banner describes partial review, not a blanket new verification.
          p=Path('tools/build-frontend-v7-9.py');s=p.read_text();needle="p='strutture-approfondite.html';s=load(p)"
          s=s.replace(needle,needle+".replace('Informazioni verificate il 21/09/2026','Riesame V7.9 parziale: 22/09/2026').replace('Questa pagina espone in forma uniforme i campi già documentati nel baseline.','Questa pagina integra i dati precedenti con un riesame parziale V7.9; le date e i campi controllati sono indicati nelle singole schede.')")
          p.write_text(s)
          PY
          python -m pip install shapely
          npm install --prefix /tmp/v79-node playwright @axe-core/playwright
          ln -s /tmp/v79-node/node_modules node_modules
          /tmp/v79-node/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate and test current release without publishing production
        run: |
          set -euo pipefail
          node tools/export-audit-rows-v7-9.cjs /tmp/baseline-rows.json --baseline
          python tools/prepare-audit-v7-9.py
          node tools/export-audit-rows-v7-9.cjs /tmp/current-rows-v79.json
          python tools/build-geography-v7-9.py /tmp/v79-research /tmp/current-rows-v79.json
          python tools/build-frontend-v7-9.py
          python tools/prepare-release-v7-9.py
          for f in assets/*v7-9.js; do node --check "$f"; done
          node --check tools/test-ui-v7-9.mjs
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/v79-tests/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          QA_OUT=/tmp/v79-tests node tools/test-ui-v7-9.mjs
          python tools/prepare-release-v7-9.py
      - name: Commit only a passing candidate to its isolated work branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = audit-geografia-v7-9
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = 498195783ca07dff14dd4f3640e7e2fae3598e06
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/audit-geografia-v7-9 --jq .object.sha)" = "${{ github.sha }}"
          python - <<'PY'
          import json,pathlib,subprocess
          report=json.loads(pathlib.Path('/tmp/v79-tests/report.json').read_text());assert report['passed']==report['total']
          allowed={'README.md','CHANGELOG.md','version.json','servizi.html','archivio.html','mappa.html','strutture-approfondite.html','documenti.html'}
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert all(p in allowed or 'v7-9' in p or 'V7_9' in p or 'v7_9' in p for p in changed),changed
          PY
          git add README.md CHANGELOG.md version.json servizi.html archivio.html mappa.html strutture-approfondite.html documenti.html assets/*v7-9.js data/*v7_9.json downloads/*V7_9* tools/test-ui-v7-9.mjs tools/prepare-audit-v7-9.py tools/prepare-release-v7-9.py tools/build-frontend-v7-9.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v7.9): add tested geography and sourced operational overlays'
            git push origin HEAD:audit-geografia-v7-9
          fi
      - name: Export exact candidate and actual test results
        if: always()
        run: |
          mkdir -p /tmp/v79-delivery
          cp -r /tmp/v79-tests /tmp/v79-delivery/tests || true
          cp /tmp/current-rows-v79.json /tmp/v79-delivery/ 2>/dev/null || true
          git rev-parse HEAD > /tmp/v79-delivery/commit.txt
          git diff --stat > /tmp/v79-delivery/uncommitted-diff.txt
          python - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('/tmp/v79-delivery/repository.zip','w',zipfile.ZIP_DEFLATED) as z:
           for p in pathlib.Path('.').rglob('*'):
            if p.is_file() and '.git' not in p.parts and 'node_modules' not in p.parts:z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-9-tested-candidate
          path: /tmp/v79-delivery/
          retention-days: 14
          if-no-files-found: error
