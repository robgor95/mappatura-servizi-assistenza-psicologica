name: Verifica pubblica staging WordPress MappaMenta
on:
  push:
    branches: [migration/altervista-wordpress]
    paths:
      - .github/workflows/verify-wordpress-staging.yml
      - tools/wordpress-staging-smoke.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Collaudo HTTP pubblico, senza credenziali e senza scritture su AlterVista
        run: python3 tools/wordpress-staging-smoke.py
