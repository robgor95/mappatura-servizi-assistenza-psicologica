name: One-time presidi geocoding
on:
  push:
    branches: [ux-map-v7-8]
    paths: ['.github/workflows/map-geocoding-once.yml']
permissions:
  contents: read
jobs:
  addresses:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact production service addresses
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const s={URL,URLSearchParams,console,document:{readyState:'loading',addEventListener(){}}};s.window=s;vm.createContext(s);
          vm.runInContext(fs.readFileSync('assets/servizi-data-v7-5-1.js','utf8'),s);
          const d=JSON.parse(fs.readFileSync('data/portal_data_v7_3.json'));const ids=new Set(d.moduli.map(r=>r.id_modulo||r.id));
          for(const r of JSON.parse(fs.readFileSync('data/multisede_v7_7_5.json')).records)if(!ids.has(r.id_modulo||r.id)){d.moduli.push(r);ids.add(r.id_modulo||r.id);}
          const rows=s.LazioServices.build(d,JSON.parse(fs.readFileSync('data/privati_v7_5.json')));
          fs.writeFileSync('/tmp/rows.json',JSON.stringify(rows.map(r=>({key:r.key,name:r.name,address:r.address,town:r.town,type:r.type,territory:r.territory}))));
          console.log('Public services:',rows.length);
          JS
      - name: Serial cached geocoding - no user input and no live API in website
        run: python3 tools/geocode-presidi-once.py /tmp/rows.json /tmp/map-geocoding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-geocoding-evidence
          path: /tmp/map-geocoding
          retention-days: 14
