name: V7.10.3 historical verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85808c6fad9dec32098558e466a3997a18b95d22
          persist-credentials: false
      - name: Check the fixed historical V7.10.3 snapshot, not current production
        run: |
          node tools/test-v7-10.cjs
          node tools/test-v7-10-2.cjs
          node tools/test-v7-10-3.cjs
