name: V7.9.3 historical verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ad2126b5c972ce49956607e368fc45b3fc4f7e6
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable V7.9.3 checkpoint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2ad2126b5c972ce49956607e368fc45b3fc4f7e6"
          node tools/test-v7-9-3.cjs
          test "$(node -p "require('./version.json').web_version")" = "7.9.3"
