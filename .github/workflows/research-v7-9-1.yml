name: V7.9.1 one-time research
on:
  push:
    branches: [geografia-operativita-v7-9-1]
    paths: [.github/workflows/research-v7-9-1.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire documentary sources and offline regional extract
        run: |
          set -euo pipefail
          python -m pip install requests beautifulsoup4 osmium shapely
          node tools/export-audit-rows-v7-9.cjs /tmp/baseline-rows.json
          python tools/research-v7-9-1.py /tmp/research-v791 /tmp/baseline-rows.json
          cp /tmp/baseline-rows.json /tmp/research-v791/
          cp tools/research-v7-9-1.py /tmp/research-v791/
          git rev-parse HEAD > /tmp/research-v791/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-9-1-research
          path: /tmp/research-v791/
          retention-days: 14
          if-no-files-found: error
