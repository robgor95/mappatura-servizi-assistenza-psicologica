name: V7.16 geography verification
on:
  push:
    branches: [release-v7-16-geography, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v716-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Static data checks
        run: |
          set -euo pipefail
          for f in assets/audit-data-v7-16.js assets/map-data-v7-16.js assets/servizi-v7-16.js assets/search-map-v7-16.js tools/test-v7-16.cjs tools/test-ui-v7-16.mjs; do node --check "$f"; done
          node tools/test-v7-16.cjs
      - name: Browser dependencies
        run: |
          npm install --prefix /tmp/v716-node playwright @axe-core/playwright
          ln -s /tmp/v716-node/node_modules node_modules
          /tmp/v716-node/node_modules/.bin/playwright install --with-deps chromium
      - name: Candidate browser and accessibility checks
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/v716-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8123/ >/dev/null && break || sleep 1; done
          node tools/test-ui-v7-16.mjs
      - name: Wait for Cloudflare production and verify
        if: github.ref == 'refs/heads/main'
        env:
          QA_BASE: https://mappatura-servizi-assistenza-psicologica.pages.dev
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H 'Cache-Control: no-cache' "$QA_BASE/version.json?commit=$GITHUB_SHA" | grep -q '"web_version": "7.16"'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          node tools/test-ui-v7-16.mjs
