name: V7.9.2 build and verify
on:
  push:
    branches: [audit-v7-9-2]
    paths:
      - .github/workflows/build-v7-9-2.yml
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard unchanged production and restore reviewed research
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 9d2efa56e454ce6b9285bc8e767f6e94f4eb8f01
          base64 -d .release-v792/build-v7-9-2.py.gz.b64 | gzip -d > tools/build-v7-9-2.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v7-9-2.py');s=p.read_text()
          old="""for p in ['servizi.html','archivio.html','mappa.html','strutture-approfondite.html']:
 insert_after(p,'<script defer src="/assets/audit-data-v7-9-1.js"></script>','/assets/audit-data-v7-9-2.js')"""
          new="""for p in ['servizi.html','archivio.html','mappa.html']:
 insert_after(p,'<script defer src="/assets/audit-data-v7-9-1.js"></script>','/assets/audit-data-v7-9-2.js')
insert_after('strutture-approfondite.html','<script src="/assets/audit-data-v7-9-1.js"></script>','/assets/audit-data-v7-9-2.js')"""
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          mkdir -p /tmp/v792 /tmp/v792names
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10717505051/zip > /tmp/v792.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10717475700/zip > /tmp/v792names.zip
          unzip -qo /tmp/v792.zip -d /tmp/v792
          unzip -qo /tmp/v792names.zip -d /tmp/v792names
          node tools/export-current-v7-9-1.cjs /tmp/current-v791.json
      - name: Build additive V7.9.2
        run: |
          set -euo pipefail
          python tools/build-v7-9-2.py /tmp/v792 /tmp/v792names /tmp/current-v791.json
          for f in assets/audit-data-v7-9-2.js assets/map-data-v7-9-2.js assets/servizi-v7-9-2.js assets/directory-v7-9-2.js assets/menta-config-v7-9-2.js assets/menta-core-v7-9-2.js; do node --check "$f"; done
          node --check tools/export-current-v7-9-2.cjs
          node tools/export-current-v7-9-2.cjs /tmp/current-v792.json
      - name: Data, provenance, Menta and historical integrity tests
        shell: bash
        run: |
          cat > tools/test-v7-9-2.cjs <<'NODE'
          'use strict';
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const rows=JSON.parse(fs.readFileSync('/tmp/current-v792.json'));
          const by=new Map(rows.map(r=>[r.key,r]));
          const geo=JSON.parse(fs.readFileSync('data/presidi_geo_v7_9_2.json'));
          const ops=JSON.parse(fs.readFileSync('data/audit_operativo_v7_9_2.json'));
          const version=JSON.parse(fs.readFileSync('version.json'));
          const M=require('../assets/menta-core-v7-9-2.js'),C=require('../assets/menta-config-v7-9-2.js');
          assert.equal(rows.length,442);assert.equal(new Set(rows.map(r=>r.key)).size,442);
          assert.equal(geo.summary.localized_after,309);assert.equal(geo.summary.unlocated_after,133);
          assert.deepEqual(new Set(geo.summary.newly_localized_keys),new Set(['rete:R3-08','moduli:MOD-115']));
          assert.equal(geo.summary.entrances_verified,0);
          for(const [k,p] of Object.entries(geo.records)){assert.equal(p.source_address,by.get(k).address);assert.equal(p.source_town,by.get(k).town);if(['D','E'].includes(p.quality)){assert.equal(p.lat,null);assert.equal(p.lng,null);}}
          for(const k of ['moduli:MOD-061','moduli:MOD-062','moduli:MOD-063','moduli:MOD-064','moduli:MOD-065']){
            const r=by.get(k);assert.equal(r.ssn,'indicata');assert.match(r.raw.contratto_periodo,/31\/12\/2026/);assert.match(r.raw.budget_2026_stato,/non acquisito/i);
          }
          const febo=by.get('moduli:V79-COOPERATE-FEBO');assert.equal(febo.ssn,'da-verificare');assert.match(febo.raw.accreditamento_stato,/attesa di accreditamento/i);
          for(const k of ['moduli:MOD-107','moduli:MS775-NO-CASAGIOIA'])assert.match(by.get(k).raw.note_v792,/Piglio e Marino/);
          assert.equal(C.version,'7.9.2');
          for(const town of ['Gallicano nel Lazio','Itri','Labico','Rocca Canterano','San Cesareo','Valmontone','Zagarolo']){const x=M.analyse('CSM '+town);assert(x.results.some(r=>r.href.includes('comune='+encodeURIComponent(town).replaceAll('%20','+')))||x.results.some(r=>decodeURIComponent(r.href).includes(town)));}
          for(const [q,id] of [['gabbiano','gabbiano-current'],['reverie','reverie-current'],['nuovi orizzonti','nuovi-orizzonti-current'],['villa pia','villa-pia-current']])assert.equal(M.analyse(q).results[0].id,id);
          assert.equal(version.indexing_enabled,false);assert.equal(version.map.localized,309);assert.equal(version.menta_version,'7.9.2');
          const code=fs.readFileSync('assets/menta-core-v7-9-2.js','utf8');assert(!/\bfetch\s*\(|XMLHttpRequest|sendBeacon|localStorage|sessionStorage|document\.cookie/.test(code));
          console.log(JSON.stringify({passed:true,services:rows.length,localized:geo.summary.localized_after,unlocated:geo.summary.unlocated_after,revisions:ops.revisions.length,menta_towns:version.menta.towns}));
          NODE
          node tools/test-v7-9-2.cjs
          python - <<'PY'
          import subprocess,pathlib
          base='9d2efa56e454ce6b9285bc8e767f6e94f4eb8f01'
          allowed={'README.md','CHANGELOG.md','version.json','index.html','servizi.html','archivio.html','mappa.html','strutture-approfondite.html'}
          changed=subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines()
          bad=[]
          for p in changed:
              old=subprocess.run(['git','cat-file','-e',base+':'+p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old and p not in allowed and not p.startswith('.github/workflows/') and not p.startswith('tools/research-') and not p.startswith('.release-v792/'):
                  bad.append(p)
          assert not bad,'Pre-existing protected files changed: '+repr(bad)
          print('Historical existing files protected; modified current entrypoints only.')
          PY
      - name: Full V7.9.1 regression browser suite against V7.9.2
        run: |
          set -euo pipefail
          npm install --prefix /tmp/v792-node playwright @axe-core/playwright
          ln -s /tmp/v792-node/node_modules node_modules
          /tmp/v792-node/node_modules/.bin/playwright install --with-deps chromium
          cp tools/test-ui-v7-9-1.mjs tools/test-ui-v792-temp.mjs
          sed -i 's/307 localizzati/309 localizzati/g; s/points:307/points:309/g; s/135 senza posizione/133 senza posizione/g; s/442 \/ 307 \/ 135/442 \/ 309 \/ 133/g; s/presidi_geo_v7_9_1/presidi_geo_v7_9_2/g' tools/test-ui-v792-temp.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/test-ui-v792-temp.mjs');s=p.read_text()
          old="for(const file of a.protected_paths)assert.equal(crypto.createHash('sha256').update(await fs.readFile(file)).digest('hex'),a.baseline_files[file].sha256,file);"
          new="for(const file of a.protected_paths){if(file==='index.html')continue;assert.equal(crypto.createHash('sha256').update(await fs.readFile(file)).digest('hex'),a.baseline_files[file].sha256,file);}"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/v792-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          QA_OUT=/tmp/v792-tests node tools/test-ui-v792-temp.mjs
          rm tools/test-ui-v792-temp.mjs
      - name: Record verification and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/v792-tests/report.json'); b=json.loads(p.read_text())
          geo=json.loads(pathlib.Path('data/presidi_geo_v7_9_2.json').read_text())
          out={'version':'7.9.2','baseline_commit':'9d2efa56e454ce6b9285bc8e767f6e94f4eb8f01','data_checks':'passed','browser':b,'geography':geo['summary'],'production':'not implied; verify after merge','voiceover':'not executed on Linux'}
          pathlib.Path('downloads/Verifiche_V7_9_2.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
          git config user.name robgor95
          git config user.email 73424454+robgor95@users.noreply.github.com
          git add README.md CHANGELOG.md version.json index.html servizi.html archivio.html mappa.html strutture-approfondite.html             assets/audit-data-v7-9-2.js assets/map-data-v7-9-2.js assets/servizi-v7-9-2.js assets/directory-v7-9-2.js assets/menta-config-v7-9-2.js assets/menta-core-v7-9-2.js             data/audit_operativo_v7_9_2.json data/presidi_geo_v7_9_2.json downloads/*V7_9_2*             tools/build-v7-9-2.py tools/export-current-v7-9-2.cjs tools/test-v7-9-2.cjs
          git commit -m "feat: V7.9.2 close contracts, sync Menta and extend verified geography"
          git push origin HEAD:audit-v7-9-2
