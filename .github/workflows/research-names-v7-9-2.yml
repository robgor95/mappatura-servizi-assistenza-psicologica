name: V7.9.2 named-facility research
on:
  push:
    branches: [audit-v7-9-2]
    paths:
      - tools/research-names-v7-9-2.py
      - .github/workflows/research-names-v7-9-2.yml
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard baseline and restore first research pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 9d2efa56e454ce6b9285bc8e767f6e94f4eb8f01
          mkdir -p /tmp/first
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10717505051/zip > /tmp/first.zip
          unzip -qo /tmp/first.zip -d /tmp/first
          node tools/export-current-v7-9-1.cjs /tmp/current-rows.json
      - name: Query only named fixed facilities
        run: python tools/research-names-v7-9-2.py /tmp/v792-names /tmp/first /tmp/current-rows.json
      - uses: actions/upload-artifact@v4
        with:
          name: v7-9-2-named-research
          path: /tmp/v792-names/
          retention-days: 14
          if-no-files-found: error
