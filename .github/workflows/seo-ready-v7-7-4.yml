name: SEO-ready 7.7.4 verification
on:
  push:
    branches: [seo-ready-v7-7-4]
    paths:
      - 'tools/apply-seo-v7-7-4.py'
      - 'tools/set-indexing.py'
      - '.github/workflows/seo-ready-v7-7-4.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-ready-v7-7-4
      - name: Apply SEO preparation with indexing disabled
        run: python3 tools/apply-seo-v7-7-4.py
      - name: Existing routing and data integrity
        run: node tools/test-menta-v7-7.cjs > /tmp/menta-tests.json
      - name: SEO and indexing assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,xml.etree.ElementTree as ET, shutil, subprocess, tempfile
          base='https://mappatura-servizi-assistenza-psicologica.pages.dev/'
          seo=[
            'index.html','servizi.html','guide/index.html','guide/primo-percorso.html',
            'guide/pubblico.html','guide/privato.html','guide/ricovero.html',
            'guide/riabilitazione.html','ascolto.html','helpline.html','centri-ascolto.html',
            'universita.html','scuole.html','privati.html','strutture-approfondite.html',
            'studenti.html','orientamento-servizi.html','glossario.html','metodo.html'
          ]
          always=['404.html','archivio.html','documenti.html','privacy.html','qualita-dati.html']
          for path in seo:
              c=Path(path).read_text()
              assert c.count('name="robots"')==1,(path,'robots')
              assert 'noindex,nofollow,noarchive,nosnippet,noimageindex' in c,(path,'noindex')
              for token in ['name="description"','rel="canonical"','property="og:title"','property="og:description"','property="og:url"','property="og:site_name"','name="twitter:card"','name="twitter:title"','name="twitter:description"']:
                  assert token in c,(path,token)
              title=re.search(r'<title>(.*?)</title>',c,re.S).group(1)
              desc=re.search(r'<meta name="description" content="([^"]+)"',c).group(1)
              assert 20<=len(title)<=75,(path,'title length',len(title))
              assert 70<=len(desc)<=180,(path,'description length',len(desc))
          for path in always:
              c=Path(path).read_text()
              assert 'noindex,nofollow,noarchive,nosnippet,noimageindex' in c,(path,'noindex')
          archive=Path('archivio.html').read_text()
          assert 'rel="canonical" href="'+base+'servizi.html"' in archive
          assert 'rel="canonical"' not in Path('404.html').read_text()
          home=Path('index.html').read_text()
          m=re.search(r'<script type="application/ld\+json" id="seo-website-jsonld">(.*?)</script>',home,re.S)
          assert m
          ld=json.loads(m.group(1)); assert ld['@type']=='WebSite' and ld['potentialAction']['@type']=='SearchAction'
          robots=Path('robots.txt').read_text()
          assert 'Allow: /' in robots and 'Disallow: /' not in robots and 'Sitemap:' not in robots
          headers=Path('_headers').read_text()
          first=headers.split('/assets/*',1)[0]
          assert 'X-Robots-Tag: noindex,nofollow,noarchive,nosnippet,noimageindex' in first
          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in root.findall('s:url/s:loc',ns)]
          assert len(locs)==len(seo)==len(set(locs))
          assert base in locs and base+'servizi.html' in locs
          for forbidden in ['archivio.html','documenti.html','privacy.html','qualita-dati.html','404.html']:
              assert not any(forbidden in u for u in locs),forbidden
          v=json.loads(Path('version.json').read_text())
          assert v['web_version']=='7.7.4' and v['seo_version']=='7.7.4'
          assert v['indexing_enabled'] is False and v['sitemap_ready'] is True
          assert subprocess.run(['git','diff','--quiet','--','data'],check=False).returncode==0
          # Test the future switch on a disposable copy. Never enable indexing in this branch.
          with tempfile.TemporaryDirectory() as td:
              dst=Path(td)/'site'
              shutil.copytree('.',dst,ignore=shutil.ignore_patterns('.git'))
              subprocess.run(['python3',str(dst/'tools/set-indexing.py'),'--enable'],cwd=dst,check=True)
              enabled=(dst/'index.html').read_text()
              assert 'index,follow,max-image-preview:large' in enabled
              assert 'Sitemap: '+base+'sitemap.xml' in (dst/'robots.txt').read_text()
              glob=(dst/'_headers').read_text().split('/assets/*',1)[0]
              assert 'X-Robots-Tag:' not in glob
              assert 'X-Robots-Tag: noindex, nofollow, noarchive' in (dst/'_headers').read_text()
              subprocess.run(['python3',str(dst/'tools/set-indexing.py'),'--disable'],cwd=dst,check=True)
              assert 'noindex,nofollow,noarchive,nosnippet,noimageindex' in (dst/'index.html').read_text()
          print(json.dumps({'seo_pages':len(seo),'indexing_enabled':False,'sitemap_urls':len(locs),'future_toggle_test':'ok'}))
          PY
      - name: Commit tested candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: prepare SEO while keeping indexing disabled"
          git push origin HEAD:seo-ready-v7-7-4
