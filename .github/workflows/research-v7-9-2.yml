name: V7.9.2 one-time research
on:
  push:
    branches: [audit-v7-9-2]
    paths:
      - tools/research-v7-9-2.py
      - .github/workflows/research-v7-9-2.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 9d2efa56e454ce6b9285bc8e767f6e94f4eb8f01
          node tools/export-current-v7-9-1.cjs /tmp/current-rows.json
      - name: Research fixed addresses and open documentary cases
        run: python tools/research-v7-9-2.py /tmp/v792 /tmp/current-rows.json
      - uses: actions/upload-artifact@v4
        with:
          name: v7-9-2-research
          path: /tmp/v792/
          retention-days: 14
          if-no-files-found: error
