name: V7.9.1 release candidate
on:
  push:
    branches: [geografia-operativita-v7-9-1]
    paths: [.github/workflows/workbench-v7-9-1.yml]
permissions:
  contents: write
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      QA_OUT: /tmp/v791-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard baseline and restore exact reviewed preparation sources
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 937713935c693dbbe50109e6738063cc0395e192
          mkdir -p /tmp/v791-tests /tmp/research-v791 /tmp/contracts-v791
          python .release-v791/restore.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/test-ui-v7-9-1.mjs');s=p.read_text()
          # Search is intentionally token-based. Use the actual site address to
          # distinguish Villa Pia from Villa Maria Pia and therapy descriptions.
          assert s.count("/mappa.html?q=Villa+Pia'")==1
          assert s.count("fill('Villa Pia')")==1
          s=s.replace('/mappa.html?q=Villa+Pia\'', '/mappa.html?q=Villa+Pia+Pantano\'').replace("fill('Villa Pia')","fill('Villa Pia Pantano')").replace('1442','1440')
          p.write_text(s)
          PY
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10692995886/zip > /tmp/research-v791.zip
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10692715958/zip > /tmp/contracts-v791.zip
          unzip -qo /tmp/research-v791.zip -d /tmp/research-v791
          unzip -qo /tmp/contracts-v791.zip -d /tmp/contracts-v791
          python -m pip install shapely beautifulsoup4 pymupdf
          npm install --prefix /tmp/v791-node playwright @axe-core/playwright
          ln -s /tmp/v791-node/node_modules node_modules
          /tmp/v791-node/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate additive current release and execute all tests
        run: |
          set -euo pipefail
          python tools/prepare-operations-v7-9-1.py /tmp/research-v791 /tmp/contracts-v791
          node tools/export-current-v7-9-1.cjs /tmp/current-rows-v791.json
          python tools/build-geo-v7-9-1.py /tmp/research-v791 /tmp/current-rows-v791.json
          python tools/build-current-v7-9-1.py
          python tools/prepare-release-v7-9-1.py
          for file in assets/*v7-9-1.js tools/*v7-9-1.cjs tools/*v7-9-1.mjs; do node --check "$file"; done
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/v791-tests/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tools/test-ui-v7-9-1.mjs
          python tools/prepare-release-v7-9-1.py
      - name: Commit only passing release on isolated work branch
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 937713935c693dbbe50109e6738063cc0395e192
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/geografia-operativita-v7-9-1 --jq .object.sha)" = "$GITHUB_SHA"
          git add README.md CHANGELOG.md version.json servizi.html archivio.html mappa.html strutture-approfondite.html documenti.html assets/*v7-9-1.js data/*v7_9_1.json downloads/*V7_9_1* tools/*v7-9-1.py tools/*v7-9-1.cjs tools/*v7-9-1.mjs
          git diff --cached --check
          git config user.name 'robgor95'
          git config user.email '73424454+robgor95@users.noreply.github.com'
          git commit -m 'feat: V7.9.1 documented unit contracts, operational overlay and offline geography'
          git push origin HEAD:geografia-operativita-v7-9-1
      - name: Export actual candidate and test evidence
        if: always()
        run: |
          mkdir -p /tmp/v791-delivery
          cp -r /tmp/v791-tests /tmp/v791-delivery/tests || true
          git rev-parse HEAD > /tmp/v791-delivery/commit.txt
          git diff --name-status 937713935c693dbbe50109e6738063cc0395e192 > /tmp/v791-delivery/changed-files.txt
          python - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('/tmp/v791-delivery/repository.zip','w',zipfile.ZIP_DEFLATED) as z:
           for p in pathlib.Path('.').rglob('*'):
            if p.is_file() and not any(x in p.parts for x in ['.git','node_modules','__pycache__','.release-v791']):z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-9-1-candidate
          path: /tmp/v791-delivery/
          retention-days: 14
          if-no-files-found: error
