name: V7.9.1 source transport integrity
on:
  push:
    branches: [geografia-operativita-v7-9-1]
    paths: [.github/workflows/check-transfer-v7-9-1.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export staged transport for byte comparison only
        run: |
          mkdir -p /tmp/transfer-v791
          cp .release-v791/part*.b64 /tmp/transfer-v791/
          sha256sum .release-v791/part*.b64 > /tmp/transfer-v791/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v791-transport-check
          path: /tmp/transfer-v791/
          retention-days: 3
