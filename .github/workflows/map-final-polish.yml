name: Map final visual polish
on:
  push:
    branches: [ux-map-v7-8]
    paths: ['.github/workflows/map-final-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prevent zoom controls covering popup headings and keep version documentation exact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/map-v7-8.js');s=p.read_text();old='map.attributionControl.setPrefix(false);';assert old in s;s=s.replace(old,old+"map.zoomControl.setPosition('bottomleft');");p.write_text(s)
          p=Path('assets/map-v7-8.css');p.write_text(p.read_text()+'\n.map-page .leaflet-container a.leaflet-popup-close-button{width:44px;height:44px;line-height:40px}.map-page .leaflet-popup-content h2{padding-right:32px}\n')
          p=Path('README.md');s=p.read_text().replace('**V7.8** per l’interfaccia e l’overlay multisede','**V7.8** per l’interfaccia, **V7.7.5** per l’overlay multisede');p.write_text(s)
          PY
      - name: Browser verification with simulated map tiles
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          SERVER=$!; trap 'kill $SERVER' EXIT
          node tools/test-ux-map-v7-8.mjs
          node tools/test-menta-v7-7.cjs >/tmp/menta-regressions.json
          cp /tmp/ux-map-tests/report.json downloads/Verifiche_UX_Mappa_V7_8.json
      - name: Save tested refinement only
        run: |
          rm .github/workflows/map-final-polish.yml
          git add assets/map-v7-8.js assets/map-v7-8.css README.md downloads/Verifiche_UX_Mappa_V7_8.json .github/workflows/map-final-polish.yml
          git diff --cached --check
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/ux-map-v7-8 | cut -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep mobile map controls clear of service popup content'
          git push origin HEAD:ux-map-v7-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-final-visual-evidence
          path: |
            /tmp/ux-map-tests
            /tmp/menta-regressions.json
          retention-days: 14
