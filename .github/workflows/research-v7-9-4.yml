name: V7.9.4 targeted research
on:
  push:
    branches: [audit-v7-9-4]
    paths:
      - tools/research-v7-9-4.py
      - .github/workflows/research-v7-9-4.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard baseline and export current rows
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 2ad2126b5c972ce49956607e368fc45b3fc4f7e6
          node tools/export-current-v7-9-3.cjs /tmp/current-v794.json
      - name: Run bounded targeted research
        run: python tools/research-v7-9-4.py /tmp/v794 /tmp/current-v794.json
      - uses: actions/upload-artifact@v4
        with:
          name: v7-9-4-targeted-research
          path: /tmp/v794/
          retention-days: 14
          if-no-files-found: error
