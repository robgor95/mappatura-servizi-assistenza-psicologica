name: V7.11.1 controlled branch build
on:
  push:
    branches: [v7-11-1-geography-review]
    paths: [.github/workflows/build-v7-11-1.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/v7-11-1-geography-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and exact source-bundle hash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '791f21cf12724ff3441492d39b6d77b4bcb36589'
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json
          root=Path('research/v7_11_1/transport')
          raw=base64.b64decode(''.join((root/f'source-{i}.b64').read_text().strip() for i in range(4)),validate=True)
          assert len(raw)==22456
          assert hashlib.sha256(raw).hexdigest()=='06f82a4f7d0bc575663337a7edacb0bf6d581ad9b87bf844a769315ac601fe53'
          payload=json.loads(lzma.decompress(raw,memlimit=128*1024*1024))
          allow={'research/v7_11_1/approved.json','tools/prepare-v7-11-1.py','tools/test-v7-11-1.cjs','tools/test-ui-v7-11-1-new.mjs','tools/verify-production-v7-11-1.py','.github/workflows/verify-v7-11-1.yml'}
          assert set(payload)==allow
          for name,text in payload.items():
              assert isinstance(text,str)
              p=Path(name)
              if name.startswith('.github/'):
                  assert p.read_text()==text, 'Workflow must have been installed separately through the connector'
              else:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          print('Exact self-authored source bundle verified; six allowed text files.')
          PY
      - name: Build approved changes without network access or geocoding
        run: |
          set -euo pipefail
          python tools/prepare-v7-11-1.py
          node tools/test-v7-11-1.cjs
          for f in assets/audit-data-v7-11-1.js assets/servizi-v7-11-1.js assets/map-data-v7-11-1.js assets/map-v7-11-1.js assets/directory-v7-11-1.js tools/test-ui-v7-11-1.mjs tools/test-ui-v7-11-1-new.mjs; do node --check "$f"; done
          git diff --exit-code -- .github/workflows
      - name: Commit only reviewed files to the working branch (never main)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('research/v7_11_1/generated-files.json').read_text())
          paths+=['research/v7_11_1/generated-files.json','research/v7_11_1/approved.json','tools/prepare-v7-11-1.py','tools/test-v7-11-1.cjs','tools/test-ui-v7-11-1-new.mjs','tools/verify-production-v7-11-1.py']
          paths=sorted({p for p in paths if not p.startswith('.github/')})
          assert all(not p.startswith('/') and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--',*[str(Path('research/v7_11_1/transport')/f'source-{i}.b64') for i in range(4)]],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V7.11.1: fourteen indicative locations and scoped conflict notes'
          git push origin HEAD:refs/heads/v7-11-1-geography-review
          mkdir -p /tmp/v7111-built
          git rev-parse HEAD > /tmp/v7111-built/commit.txt
          git diff --name-status 791f21cf12724ff3441492d39b6d77b4bcb36589 HEAD > /tmp/v7111-built/changes.txt
          git archive --format=zip HEAD -o /tmp/v7111-built/repository.zip
      - uses: actions/upload-artifact@v4
        with:
          name: v7111-built-candidate
          path: /tmp/v7111-built/
          retention-days: 7
          if-no-files-found: error
